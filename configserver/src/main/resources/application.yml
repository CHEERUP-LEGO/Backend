spring:
  application:
    name: config-server
  profiles:
    active:
      - git
  cloud:
    config:
      server:
        git:
#          uri: https://github.com/LGCNS-AM-Camp-PJT1-Team9/resources.git
          uri: https://github.com/CHEERUP-LEGO/resources.git
          search-paths:
            - eureka-server-8070-dns
            - gateway-server-8072-dns
            - jobbotdari-user-8080-dns
            - jobbotdari-8081-dns
          username: ${GIT_USERNAME}
          password: ${GIT_PW}
          default-label: main
  rabbitmq:
    host: 3.143.42.91
    port: 5672
    username: guest
    password: guest
server:
  port: 8071

management:
  endpoints:
    web:
      exposure:
        include: refresh, health, beans, httptrace, busrefresh